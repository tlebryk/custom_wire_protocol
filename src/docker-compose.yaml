version: '3.8'

services:
  server:
    build: .
    command: python server.py --port 50051 --replicas replica1:50052,replica2:50053
    ports:
      - "50051:50051"
    environment:
      - DB_FILE=/data/chat_app.db
    volumes:
      - ./data/server:/data
    networks:
      - chat-network
    depends_on:
      - replica1
      - replica2

  replica1:
    build: .
    command: python replica_server.py --port 50052 --replica-id 1 --db-file /data/replica1_chat_app.db
    ports:
      - "50052:50052"
    environment:
      - DB_FILE=/data/replica1_chat_app.db
    volumes:
      - ./data/replica1:/data
    networks:
      - chat-network

  replica2:
    build: .
    command: python replica_server.py --port 50053 --replica-id 2 --db-file /data/replica2_chat_app.db
    ports:
      - "50053:50053"
    environment:
      - DB_FILE=/data/replica2_chat_app.db
    volumes:
      - ./data/replica2:/data
    networks:
      - chat-network

networks:
  chat-network:
    driver: bridge

volumes:
  data:
